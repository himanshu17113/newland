name: newlandscanner
description: Flutter plugin for Newland barcode scanners on Android PDAs.
version: 1.0.1
homepage: https://github.com/himanshu17113/newland
repository: https://github.com/himanshu17113/newland
issue_tracker: https://github.com/himanshu17113/newland/issues

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.himanshu.newland
        pluginClass: NewlandscannerPlugin
